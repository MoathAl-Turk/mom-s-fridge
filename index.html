<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mom's Fridge & Dinner Poll</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load Firebase -->
    <script type="module" src="app.js"></script>
</head>
<body>
    <div id="login-screen">
        <h1>Welcome to the Family Fridge</h1>
        <button id="login-btn">Log in with Google</button>
    </div>

    <div id="main-app" style="display: none;">
        <header>
            <h1 id="greeting">Hello!</h1>
            <button id="logout-btn">Log Out</button>
        </header>

        <!-- Everyone sees what's in the fridge -->
        <section id="fridge-section">
            <h2>What's in the Fridge?</h2>
            <ul id="fridge-list"></ul>
            
            <!-- ONLY MOM SEES THIS -->
            <div id="mom-controls" style="display: none;">
                <input type="text" id="new-item" placeholder="Add an item...">
                <button id="add-item-btn">Add to Fridge</button>
            </div>
        </section>

        <!-- Siblings leave notes here -->
        <section id="notes-section">
            <h2>Dinner Suggestions</h2>
            <textarea id="dinner-note" placeholder="What do you want for dinner?"></textarea>
            <button id="submit-note-btn">Send to Mom</button>
            <div id="all-notes"></div>
        </section>

        <!-- The Poll -->
        <section id="poll-section">
            <h2>Tonight's Dinner Poll</h2>
            <div id="active-poll"></div>
            
            <!-- ONLY MOM SEES THIS -->
            <div id="mom-poll-controls" style="display: none;">
                <input type="text" id="poll-option-1" placeholder="Option 1">
                <input type="text" id="poll-option-2" placeholder="Option 2">
                <button id="create-poll-btn">Create Poll</button>
            </div>
        </section>
    </div>
</body>
</html>
