<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mom's Fridge & Dinner Poll</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <!-- New Theme Button -->
    <button id="theme-toggle" class="theme-btn">Toggle Theme</button>

    <div id="login-screen">
        <h1>Welcome to the Family Fridge</h1>
        
        <div id="role-selection">
            <button id="sibling-login-btn">I am a Sibling</button>
            <button id="mom-login-btn">I am Mom</button>
        </div>
        
        <div id="password-section" style="display: none; margin-top: 15px;">
            <input type="password" id="mom-password" placeholder="Enter Mom's Password">
            <button id="verify-password-btn">Submit Password</button>
            <p id="password-error" style="color: #d62828; display: none;">Incorrect password!</p>
        </div>
    </div>

    <div id="main-app" style="display: none;">
        <header>
            <h1 id="greeting">Hello!</h1>
            <button id="logout-btn">Log Out</button>
        </header>

        <section id="fridge-section">
            <h2>What's in the Fridge?</h2>
            <ul id="fridge-list"></ul>
            
            <div id="mom-controls" style="display: none;">
                <input type="text" id="new-item" placeholder="Add an item...">
                <button id="add-item-btn">Add to Fridge</button>
            </div>
        </section>

       <section id="notes-section">
            <h2>Dinner Suggestions</h2>
            
            <!-- New Moath Examples Line -->
            <p style="font-size: 0.85em; margin-top: 0; margin-bottom: 12px; color: var(--text-color); opacity: 0.9;">
                <em>If you don't know what to eat, here are some examples from Moath: 
                    <a href="https://www.google.com/imgres?q=maftool&imgurl=https%3A%2F%2Fslowmed.eu%2Fmedia%2Frecipe-maftool.jpg&imgrefurl=https%3A%2F%2Fslowmed.eu%2Frecipe%2Fmaftool%2F&docid=sljCLYNzMH7CeM&tbnid=LzRwYqOseaeEXM&vet=12ahUKEwjj8rrip_2XAxUMVKQEHdmAKNoQnPAOegUIjwIQAA..i&w=700&h=525&hcb=2&ved=2ahUKEwjj8rrip_2XAxUMVKQEHdmAKNoQnPAOegUIjwIQAA" 
                       target="_blank" 
                       style="color: var(--primary-accent); font-weight: bold; text-decoration: none;">
                       Maftool
                    </a>
                </em>
            </p>

            <textarea id="dinner-note" placeholder="What do you want for dinner?"></textarea>
            <button id="submit-note-btn">Send to Mom</button>
            <div id="all-notes"></div>
        </section>

        <section id="poll-section">
            <h2>Tonight's Dinner Poll</h2>
            <div id="active-poll"></div>
            
            <div id="mom-poll-controls" style="display: none;">
                <input type="text" id="poll-option-1" placeholder="Option 1">
                <input type="text" id="poll-option-2" placeholder="Option 2">
                <button id="create-poll-btn">Create Poll</button>
                <button id="delete-poll-btn" style="background-color: #d62828;">Delete Poll</button>
            </div>
        </section>
    </div>
</body>
</html>
